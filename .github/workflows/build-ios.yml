name: Build iOS IPA (TrollStore)

# 手动触发，不需要签名（TrollStore 用）
on:
  workflow_dispatch:
    inputs:
      flutter_version:
        description: Flutter SDK version
        required: false
        default: '3.47.0'

permissions:
  contents: read

jobs:
  build-ios:
    name: Build unsigned IPA for TrollStore
    runs-on: macos-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ inputs.flutter_version }}
          cache: true

      - name: Flutter create iOS project (if missing)
        working-directory: dsh-mobile-app
        run: |
          if [ ! -d ios ]; then
            echo "No ios/ dir found, generating..."
            flutter create . --platforms=ios
          fi

      - name: Patch Info.plist (camera / local network / HTTP)
        working-directory: dsh-mobile-app
        run: |
          PLIST="ios/Runner/Info.plist"
          /usr/libexec/PlistBuddy -c "Delete :NSCameraUsageDescription" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 扫描电脑上的连接二维码" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :NSLocalNetworkUsageDescription" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSLocalNetworkUsageDescription string 连接局域网内的电脑" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :NSAppTransportSecurity" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" "$PLIST"
          echo "=== Patched Info.plist (permissions) ==="
          /usr/libexec/PlistBuddy -c "Print" "$PLIST" | grep -E "Camera|LocalNetwork|AppTransport|Arbitrary" -A1 || true

      - name: Install CocoaPods
        run: gem install cocoapods --no-document

      - name: Get deps
        working-directory: dsh-mobile-app
        run: flutter pub get

      - name: Build unsigned iOS .app
        working-directory: dsh-mobile-app
        run: flutter build ios --release --no-codesign

      - name: Package .ipa (unsigned, TrollStore-compatible)
        run: |
          APP_PATH=$(find dsh-mobile-app/build -name "*.app" -type d | head -1)
          echo "Found .app: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r DSH-Remote-unsigned.ipa Payload
          ls -lh DSH-Remote-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: DSH-Remote-iOS-unsigned
          path: DSH-Remote-unsigned.ipa
          if-no-files-found: error
