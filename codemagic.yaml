workflows:
  ios-unsigned:
    name: DSH Remote - iOS unsigned IPA
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: 3.47.0
      xcode: latest
      cocoapods: default
    scripts:
      - name: Ensure iOS platform exists
        script: |
          cd dsh-mobile-app
          if [ ! -d ios ]; then
            flutter create . --platforms=ios
          fi
      - name: Set app display name
        script: |
          cd dsh-mobile-app
          PLIST=ios/Runner/Info.plist
          plutil -replace CFBundleName -string "达货遥控器" "$PLIST"
          plutil -replace CFBundleDisplayName -string "达货遥控器" "$PLIST"
          plutil -p "$PLIST" | grep -E "CFBundle(Name|DisplayName)"
      - name: Patch iOS permissions
        script: |
          cd dsh-mobile-app
          PLIST=ios/Runner/Info.plist
          PB=/usr/libexec/PlistBuddy
          $PB -c "Delete :NSCameraUsageDescription" "$PLIST" 2>/dev/null || true
          $PB -c "Add :NSCameraUsageDescription string 用于扫描电脑上的连接二维码" "$PLIST"
          $PB -c "Delete :NSLocalNetworkUsageDescription" "$PLIST" 2>/dev/null || true
          $PB -c "Add :NSLocalNetworkUsageDescription string 用于连接局域网内的电脑" "$PLIST"
          $PB -c "Delete :NSAppTransportSecurity" "$PLIST" 2>/dev/null || true
          $PB -c "Add :NSAppTransportSecurity dict" "$PLIST"
          $PB -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" "$PLIST"
          echo "--- patched Info.plist ---"
          $PB -c "Print :NSCameraUsageDescription" "$PLIST"
          $PB -c "Print :NSLocalNetworkUsageDescription" "$PLIST"
          $PB -c "Print :NSAppTransportSecurity" "$PLIST"
      - name: Resolve packages
        script: |
          cd dsh-mobile-app
          flutter pub get
      - name: Build unsigned iOS app
        script: |
          cd dsh-mobile-app
          flutter build ios --release --no-codesign
      - name: Package into IPA
        script: |
          set -e
          APP=$(find dsh-mobile-app/build/ios/iphoneos -maxdepth 1 -name "*.app" -type d | head -1)
          echo "App bundle: $APP"
          rm -rf build_payload
          mkdir -p build_payload/Payload
          cp -R "$APP" build_payload/Payload/
          cd build_payload
          zip -qry ../DSH-Remote-unsigned.ipa Payload
          cd ..
          ls -lh DSH-Remote-unsigned.ipa
    artifacts:
      - DSH-Remote-unsigned.ipa
